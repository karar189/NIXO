[package]
name = "nixo-checker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NIXO checker: screens a confidential history against pinned lists, emits only a verdict"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nixo_checker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
