[package]
name = "nixo-checker"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "NIXO checker: screens a confidential history against pinned lists, emits only a verdict"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nixo_checker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

# OutLayer / wasmtime WASI P2: HTTPS via wasi:http.
[target.'cfg(target_family = "wasm")'.dependencies]
wasi-http-client = { version = "0.2.1", features = ["json"] }

# Host builds (unit tests, local live smoke): blocking HTTPS.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "2.12", default-features = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
