[project]
name = "neararc-agents"
version = "0.1.0"
description = "NearArc agents service (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anthropic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
# CI gate: correctness only (syntax errors + pyflakes: undefined names, unused
# imports, etc.). Ruff's wider default style rules currently report 8 findings
# in the imported NearArc code (import order, dict() literal, one SIM114, three
# intentional multi-line string concatenations); those are left for a separate
# cleanup so this merge doesn't touch trading logic.
select = ["E9", "F"]

